<!doctype html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>BOMBA</title>
<style>
  :root{
    --bg:#0a0908;
    --bg2:#141210;
    --fuse:#ff5a1f;
    --spark:#ffd23f;
    --ember:#8a2a12;
    --paper:#e8e2d6;
    --danger:#ff2d2d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; height:100%; overflow:hidden;
    background:var(--bg);
    font-family:'Courier New', ui-monospace, monospace;
    touch-action:manipulation;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    min-height:100dvh;
  }

  .frame{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px;
    background:
      radial-gradient(120% 90% at 50% 15%, #1c1613 0%, var(--bg) 55%);
  }

  /* burning border track */
  .track{
    position:fixed; inset:10px;
    border-radius:28px;
    border:2px solid #2a2320;
    pointer-events:none;
  }
  .spark{
    position:fixed;
    width:10px; height:10px;
    border-radius:50%;
    background:var(--spark);
    box-shadow:0 0 10px 3px var(--fuse), 0 0 22px 8px rgba(255,90,31,0.5);
    pointer-events:none;
    transition:none;
  }

  .stage{
    position:relative;
    display:flex; flex-direction:column; align-items:center; gap:18px;
    z-index:2;
  }

  .eyebrow{
    letter-spacing:0.35em;
    font-size:11px;
    color:#8a7f70;
    text-transform:uppercase;
  }

  .bombwrap{
    position:relative;
    width:min(58vw, 260px);
    height:min(58vw, 260px);
    display:flex; align-items:center; justify-content:center;
  }
  .bomb{
    width:100%; height:100%;
    border-radius:50%;
    background:
      radial-gradient(circle at 35% 30%, #2c2622 0%, #171310 55%, #0c0a08 100%);
    box-shadow:
      inset 0 0 0 2px #332b25,
      inset -10px -14px 30px rgba(0,0,0,0.6),
      0 18px 40px rgba(0,0,0,0.55);
    display:flex; align-items:center; justify-content:center;
  }
  .bomb .label{
    font-family:Georgia, 'Times New Roman', serif;
    font-weight:700;
    font-style:italic;
    font-size:clamp(20px, 6vw, 30px);
    color:var(--paper);
    letter-spacing:0.06em;
    opacity:0.85;
  }
  .wick{
    position:absolute;
    top:-34px; left:50%;
    width:6px; height:44px;
    background:#5b4636;
    transform-origin:bottom center;
    transform:translateX(-50%) rotate(6deg);
    border-radius:3px;
  }
  .wickflame{
    position:absolute;
    top:-48px; left:50%;
    transform:translateX(-50%);
    font-size:26px;
    filter:drop-shadow(0 0 8px #ff8a3d);
    animation:flick 0.18s infinite alternate;
  }
  @keyframes flick{ from{transform:translateX(-50%) scale(1) rotate(-4deg);} to{transform:translateX(-50%) scale(1.12) rotate(4deg);} }

  .bomb.tense{ animation:heartbeat var(--beat, 0.9s) ease-in-out infinite; }
  @keyframes heartbeat{
    0%{ transform:scale(1); }
    30%{ transform:scale(1.035); }
    45%{ transform:scale(1); }
    60%{ transform:scale(1.02); }
    100%{ transform:scale(1); }
  }

  .status{
    font-size:12px;
    color:#8a7f70;
    letter-spacing:0.08em;
    min-height:16px;
    text-align:center;
  }

  .passbtn{
    appearance:none; border:none;
    padding:18px 44px;
    font-family:inherit;
    font-weight:700;
    font-size:16px;
    letter-spacing:0.14em;
    color:#150c07;
    background:linear-gradient(180deg, var(--spark), var(--fuse));
    border-radius:999px;
    box-shadow:0 10px 24px rgba(255,90,31,0.28), inset 0 1px 0 rgba(255,255,255,0.35);
    cursor:pointer;
    transition:transform .08s ease;
  }
  .passbtn:active{ transform:scale(0.94); }

  .setup{ display:flex; flex-direction:column; align-items:center; gap:22px; z-index:2; text-align:center;}
  .title{
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic;
    font-weight:700;
    font-size:clamp(38px, 12vw, 64px);
    color:var(--paper);
    letter-spacing:0.02em;
    margin:0;
  }
  .title span{ color:var(--fuse); }
  .subtitle{ color:#8a7f70; font-size:13px; max-width:280px; line-height:1.6; }

  .rangepick{
    display:flex; gap:10px;
  }
  .rangebtn{
    appearance:none; border:1px solid #33291f;
    background:#171310; color:#c8beac;
    padding:10px 16px; border-radius:12px;
    font-family:inherit; font-size:13px; letter-spacing:0.04em;
    cursor:pointer;
  }
  .rangebtn.active{
    border-color:var(--fuse);
    color:var(--paper);
    background:#241811;
    box-shadow:0 0 0 1px var(--fuse);
  }

  .startbtn{
    appearance:none; border:none;
    padding:20px 50px;
    font-family:inherit; font-weight:700; font-size:17px; letter-spacing:0.14em;
    color:#150c07;
    background:linear-gradient(180deg, var(--spark), var(--fuse));
    border-radius:999px;
    box-shadow:0 10px 28px rgba(255,90,31,0.3), inset 0 1px 0 rgba(255,255,255,0.35);
    cursor:pointer;
  }
  .startbtn:active{ transform:scale(0.96); }

  /* explosion */
  .boomscreen{
    position:fixed; inset:0; z-index:10;
    display:none;
    align-items:center; justify-content:center;
    flex-direction:column; gap:18px;
    background:#0a0908;
  }
  .boomscreen.show{ display:flex; }
  .flash{
    position:fixed; inset:0; background:#fff; opacity:0;
    pointer-events:none; z-index:9;
  }
  .flash.go{ animation:flashpop .5s ease-out forwards; }
  @keyframes flashpop{ 0%{opacity:1;} 100%{opacity:0;} }

  .boomword{
    font-family:Georgia, 'Times New Roman', serif;
    font-style:italic; font-weight:700;
    font-size:clamp(56px, 20vw, 110px);
    color:var(--danger);
    text-shadow:0 0 30px rgba(255,45,45,0.6);
    animation:shockwave .45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes shockwave{
    0%{ transform:scale(0.3); opacity:0; }
    60%{ transform:scale(1.15); opacity:1; }
    100%{ transform:scale(1); }
  }
  .boomsub{ color:#c8beac; font-size:13px; letter-spacing:0.08em; }
  .again{
    margin-top:10px;
    appearance:none; border:1px solid #33291f;
    background:#171310; color:#e8e2d6;
    padding:14px 30px; border-radius:999px;
    font-family:inherit; font-size:14px; letter-spacing:0.1em;
    cursor:pointer;
  }

  .shake{ animation:shakeit .5s ease-in-out; }
  @keyframes shakeit{
    0%,100%{ transform:translate(0,0); }
    20%{ transform:translate(-6px,4px); }
    40%{ transform:translate(6px,-4px); }
    60%{ transform:translate(-8px,-2px); }
    80%{ transform:translate(8px,2px); }
  }

  footer.credit{
    position:fixed; bottom:10px; left:0; right:0;
    text-align:center; font-size:10px; color:#4a4038; letter-spacing:0.08em;
    z-index:2;
  }
</style>
</head>
<body>

<div class="flash" id="flash"></div>
<div class="track"></div>
<div class="spark" id="spark" style="display:none;"></div>

<div class="frame" id="frame">

  <!-- SETUP SCREEN -->
  <div class="setup" id="setup">
    <h1 class="title">BOM<span>BA</span></h1>
    <p class="subtitle">Podávejte si telefon dokola. Nikdo neví, kdy vybuchne. Kdo ji drží v ruce, prohrává.</p>
    <div>
      <div class="eyebrow" style="margin-bottom:10px;">DÉLKA ZÁPALNICE</div>
      <div class="rangepick" id="rangepick">
        <button class="rangebtn" data-min="10" data-max="25">RYCHLÁ</button>
        <button class="rangebtn active" data-min="20" data-max="60">STŘEDNÍ</button>
        <button class="rangebtn" data-min="45" data-max="120">DLOUHÁ</button>
      </div>
    </div>
    <button class="startbtn" id="startBtn">ZAPÁLIT ⚡</button>
  </div>

  <!-- GAME SCREEN -->
  <div class="stage" id="stage" style="display:none;">
    <div class="eyebrow">PODÁVEJ DÁL</div>
    <div class="bombwrap">
      <div class="wick"></div>
      <div class="wickflame">🔥</div>
      <div class="bomb" id="bomb">
        <div class="label">BOMBA</div>
      </div>
    </div>
    <div class="status" id="status">drž pevně...</div>
    <button class="passbtn" id="passBtn">PŘEDAT DÁL</button>
  </div>

</div>

<!-- BOOM SCREEN -->
<div class="boomscreen" id="boomscreen">
  <div class="boomword">BUM!</div>
  <div class="boomsub" id="boomsub">Kdo to drží, ten prohrál.</div>
  <button class="again" id="againBtn">HODIT ZNOVA</button>
</div>

<footer class="credit">tap-to-pass · vibrace zapnutá · žádný časovač se nezobrazuje</footer>

<script>
(function(){
  const setup = document.getElementById('setup');
  const stage = document.getElementById('stage');
  const boomscreen = document.getElementById('boomscreen');
  const flash = document.getElementById('flash');
  const frame = document.getElementById('frame');
  const bomb = document.getElementById('bomb');
  const status = document.getElementById('status');
  const passBtn = document.getElementById('passBtn');
  const startBtn = document.getElementById('startBtn');
  const againBtn = document.getElementById('againBtn');
  const rangepick = document.getElementById('rangepick');
  const spark = document.getElementById('spark');

  let minSec = 20, maxSec = 60;
  let boomAt = 0;
  let startedAt = 0;
  let ticking = null;
  let sparkAnim = null;
  let audioCtx = null;

  rangepick.addEventListener('click', (e)=>{
    const btn = e.target.closest('.rangebtn');
    if(!btn) return;
    [...rangepick.children].forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    minSec = parseInt(btn.dataset.min);
    maxSec = parseInt(btn.dataset.max);
  });

  function beep(freq, dur, type='sine', vol=0.15){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }

  function vibrate(pattern){
    if(navigator.vibrate) navigator.vibrate(pattern);
  }

  function rand(min,max){ return Math.random()*(max-min)+min; }

  function trackRect(){
    const el = document.querySelector('.track');
    return el.getBoundingClientRect();
  }

  function startSpark(){
    spark.style.display = 'block';
    let t = 0;
    const speed0 = 0.15; // laps per second at start
    function frame(ts){
      if(!sparkAnim.running) return;
      const now = performance.now();
      const elapsed = (now - startedAt) / 1000;
      const total = (boomAt - startedAt) / 1000;
      const progress = Math.min(elapsed / total, 1);
      // speed ramps up as we approach boom
      const laps = progress * 2.4 + Math.pow(progress, 3) * 3;
      const rect = trackRect();
      const perim = 2*(rect.width + rect.height);
      const dist = (laps * perim) % perim;
      let x, y;
      if(dist < rect.width){ x = rect.left + dist; y = rect.top; }
      else if(dist < rect.width + rect.height){ x = rect.right; y = rect.top + (dist - rect.width); }
      else if(dist < 2*rect.width + rect.height){ x = rect.right - (dist - rect.width - rect.height); y = rect.bottom; }
      else { x = rect.left; y = rect.bottom - (dist - 2*rect.width - rect.height); }
      spark.style.left = (x-5)+'px';
      spark.style.top = (y-5)+'px';

      // heartbeat gets faster
      const beatDur = Math.max(0.32, 1.0 - progress*0.7);
      bomb.style.setProperty('--beat', beatDur+'s');

      requestAnimationFrame(frame);
    }
    sparkAnim = { running:true };
    requestAnimationFrame(frame);
  }

  function stopSpark(){
    if(sparkAnim) sparkAnim.running = false;
    spark.style.display = 'none';
  }

  function startGame(){
    setup.style.display = 'none';
    stage.style.display = 'flex';
    boomscreen.classList.remove('show');
    bomb.classList.add('tense');
    bomb.style.setProperty('--beat','0.95s');
    status.textContent = 'drž pevně...';

    startedAt = performance.now();
    const dur = rand(minSec, maxSec) * 1000;
    boomAt = startedAt + dur;

    startSpark();

    ticking = setTimeout(explode, dur);

    // ambient tick sound occasionally
    scheduleTicks();
  }

  let tickTimeout = null;
  function scheduleTicks(){
    const now = performance.now();
    if(now >= boomAt) return;
    const remain = boomAt - now;
    const elapsedFrac = 1 - (remain / (boomAt - startedAt));
    const gap = Math.max(140, 700 - elapsedFrac*550);
    beep(220 + elapsedFrac*300, 0.05, 'square', 0.05);
    vibrate(15);
    tickTimeout = setTimeout(scheduleTicks, gap);
  }

  passBtn.addEventListener('click', ()=>{
    passBtn.disabled = true;
    passBtn.textContent = 'DÁL!';
    beep(500, 0.08, 'triangle', 0.08);
    setTimeout(()=>{
      passBtn.disabled = false;
      passBtn.textContent = 'PŘEDAT DÁL';
    }, 220);
  });

  function explode(){
    clearTimeout(tickTimeout);
    stopSpark();
    stage.style.display = 'none';
    boomscreen.classList.add('show');
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    document.body.classList.add('shake');
    setTimeout(()=>document.body.classList.remove('shake'), 500);
    vibrate([0, 200, 60, 200, 60, 400]);
    beep(90, 0.6, 'sawtooth', 0.25);
    beep(60, 0.8, 'square', 0.18);
  }

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', ()=>{
    boomscreen.classList.remove('show');
    setup.style.display = 'flex';
  });

})();
</script>

</body>
</html>
